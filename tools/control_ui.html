<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ALAS 队列控制台</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      font-size: 14px;
      line-height: 1.5;
      color: #242d32;
      background: #f4f6f5;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button, input, textarea { font: inherit; }
    button { cursor: pointer; }
    button:disabled { cursor: not-allowed; opacity: .45; }
    button:focus-visible, input:focus-visible, textarea:focus-visible, summary:focus-visible {
      outline: 2px solid #007d76;
      outline-offset: 2px;
    }
    .topbar { background: #24333a; color: #fff; border-bottom: 3px solid #008e80; }
    .topbar-inner, main { width: min(100% - 40px, 1440px); margin: auto; }
    .topbar-inner { min-height: 75px; display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    h1 { margin: 0; font-size: 20px; font-weight: 650; }
    h2 { margin: 0; font-size: 17px; font-weight: 650; }
    h3 { margin: 0; font-size: 14px; font-weight: 650; }
    .topmeta { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; justify-content: flex-end; }
    .topmeta small { color: #b8c9c9; }
    .status { display: inline-flex; align-items: center; gap: 7px; min-width: 76px; font-weight: 650; }
    .status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #aab6b9; }
    .status.running::before { background: #68d7ba; }
    .status.idle::before { background: #e3b760; }
    .status.offline::before { background: #f18b80; }
    main { padding: 24px 0 54px; }
    .notice { margin-bottom: 16px; padding: 10px 13px; border-left: 3px solid #c64c43; background: #fff0ec; color: #8e302b; overflow-wrap: anywhere; }
    .notice:empty { display: none; }
    .workspace { display: grid; grid-template-columns: minmax(350px, 41%) minmax(0, 1fr); gap: 28px; align-items: start; }
    .editor-pane, .report-pane { min-width: 0; }
    .editor-pane { position: sticky; top: 20px; }
    .section { padding: 0 0 22px; border-bottom: 1px solid #d4dcda; margin-bottom: 22px; }
    .section-heading { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .muted { color: #68777b; }
    .small { font-size: 12px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
    .tool-button, .secondary, .primary, .danger {
      border: 1px solid transparent; border-radius: 5px; min-height: 36px;
      padding: 7px 13px; font-weight: 600;
    }
    .tool-button, .secondary { background: #fff; color: #2b4245; border-color: #bfcac8; }
    .tool-button:hover:not(:disabled), .secondary:hover:not(:disabled) { background: #edf3f1; }
    .primary { background: #007a70; color: #fff; }
    .primary:hover:not(:disabled) { background: #00665d; }
    .danger { background: #fff1eb; color: #a43c2e; border-color: #d49587; }
    .danger:hover:not(:disabled) { background: #ffe5db; }
    textarea {
      display: block; width: 100%; min-height: 330px; padding: 12px 13px; resize: vertical;
      border: 1px solid #aab9b8; border-radius: 5px; background: #fff;
      color: #1f2b30; font: 13px/1.5 Consolas, "Cascadia Code", monospace;
      tab-size: 2;
    }
    textarea[aria-invalid="true"] { border-color: #bf4e45; }
    .field-error { color: #a43c2e; min-height: 20px; margin-top: 6px; overflow-wrap: anywhere; }
    fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
    fieldset:disabled { opacity: .7; }
    .mode-row { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); border: 1px solid #b9c8c5; border-radius: 5px; overflow: hidden; background: #fff; }
    .mode-row label { min-width: 0; }
    .mode-row label + label { border-left: 1px solid #b9c8c5; }
    .mode-row input { position: absolute; opacity: 0; width: 1px; height: 1px; }
    .mode-row span { display: flex; align-items: center; justify-content: center; text-align: center; min-height: 40px; padding: 6px; cursor: pointer; }
    .mode-row input:checked + span { color: #fff; background: #007a70; font-weight: 650; }
    .mode-row input[value="actions"]:checked + span { background: #a54732; }
    .mode-row input:focus-visible + span { outline: 2px solid #007d76; outline-offset: -3px; }
    .mode-warning { min-height: 22px; margin: 8px 0 0; color: #9a4a2e; }
    .field-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 13px; margin-top: 16px; }
    .field-grid label { display: grid; gap: 5px; font-weight: 600; }
    .field-grid input { width: 100%; min-width: 0; min-height: 36px; padding: 6px 9px; border: 1px solid #aab9b8; border-radius: 5px; background: #fff; }
    .checkline { display: flex; align-items: center; gap: 8px; margin-top: 15px; cursor: pointer; }
    .checkline input { width: 16px; height: 16px; accent-color: #007a70; }
    .action-row { display: flex; gap: 9px; margin-top: 18px; }
    .action-row button { flex: 1; }
    .action-message { min-height: 22px; margin: 8px 0 0; color: #496466; }
    .report-title { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
    .refresh { padding: 5px 10px; min-height: 32px; }
    .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-block: 1px solid #d4dcda; margin-top: 12px; }
    .metric { padding: 12px 10px; min-width: 0; }
    .metric + .metric { border-left: 1px solid #d4dcda; }
    .metric-label { display: block; color: #68777b; font-size: 12px; }
    .metric-value { display: block; margin-top: 2px; font-size: 18px; font-weight: 650; overflow-wrap: anywhere; }
    .report-meta { padding-top: 12px; color: #556569; overflow-wrap: anywhere; }
    .empty { padding: 16px 0; color: #68777b; }
    .item-list, .finding-list { border-top: 1px solid #d4dcda; }
    .item, .finding { border-bottom: 1px solid #d4dcda; }
    .item summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 10px; padding: 11px 0; }
    .item summary::-webkit-details-marker { display: none; }
    .item-title { font-weight: 650; overflow-wrap: anywhere; }
    .item-meta { display: block; color: #68777b; font-size: 12px; overflow-wrap: anywhere; }
    .outcome { align-self: start; border-radius: 3px; padding: 2px 7px; background: #e3eae8; color: #34494b; font-size: 12px; font-weight: 650; white-space: nowrap; }
    .outcome[data-value="succeeded"] { background: #d9ece4; color: #17684b; }
    .outcome[data-value="failed"], .outcome[data-value="refused"], .outcome[data-value="withdrawn"] { background: #f7dfd9; color: #973d31; }
    .outcome[data-value="dry_run"], .outcome[data-value="skipped"] { background: #e8e7df; color: #595e52; }
    .item-detail { padding: 0 0 12px; }
    .item-detail dl { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 4px 8px; margin: 0 0 8px; }
    .item-detail dt { color: #68777b; }
    .item-detail dd { margin: 0; overflow-wrap: anywhere; }
    .item-detail pre, .raw-report pre {
      max-height: 260px; overflow: auto; margin: 8px 0 0; padding: 10px;
      border: 1px solid #d1dbd8; background: #fff; white-space: pre-wrap; overflow-wrap: anywhere;
      font: 12px/1.5 Consolas, "Cascadia Code", monospace;
    }
    .finding { display: grid; grid-template-columns: minmax(100px, 26%) minmax(0, 1fr); gap: 12px; padding: 10px 0; }
    .finding-code { font-weight: 650; overflow-wrap: anywhere; }
    .finding-detail { overflow-wrap: anywhere; }
    .finding-path { display: block; color: #68777b; font-size: 12px; margin-top: 3px; }
    .logs { max-height: 250px; min-height: 90px; overflow: auto; padding: 12px; margin: 0; border-radius: 4px; background: #243037; color: #e8f0ed; font: 12px/1.55 Consolas, "Cascadia Code", monospace; white-space: pre-wrap; overflow-wrap: anywhere; }
    .raw-report summary { cursor: pointer; color: #006d67; font-weight: 600; }
    dialog { width: min(100% - 32px, 450px); padding: 22px; border: 1px solid #bdc9c6; border-radius: 7px; box-shadow: 0 20px 70px #101c2055; color: #263237; }
    dialog::backdrop { background: #1d2c32a8; }
    dialog p { margin: 10px 0 18px; }
    .dialog-actions { display: flex; gap: 9px; justify-content: flex-end; }
    @media (max-width: 900px) {
      .workspace { grid-template-columns: minmax(0, 1fr); gap: 12px; }
      .editor-pane { position: static; }
      textarea { min-height: 240px; }
    }
    @media (max-width: 560px) {
      .topbar-inner, main { width: min(100% - 24px, 1440px); }
      .topbar-inner { padding: 13px 0; align-items: flex-start; flex-direction: column; gap: 6px; }
      h1 { font-size: 18px; }
      main { padding-top: 18px; }
      .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric:nth-child(3) { border-left: 0; border-top: 1px solid #d4dcda; }
      .metric:nth-child(4) { border-top: 1px solid #d4dcda; }
      .field-grid { grid-template-columns: 1fr; }
      .item-detail dl { grid-template-columns: 1fr; gap: 1px; }
      .item-detail dd { margin-bottom: 7px; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>ALAS 队列控制台</h1>
      <div class="topmeta"><span id="status" class="status offline" role="status">连接中</span><small id="current-mode">-</small></div>
    </div>
  </header>
  <main>
    <div id="notice" class="notice" role="alert" aria-live="polite"></div>
    <div class="workspace">
      <div class="editor-pane">
        <section class="section" aria-labelledby="queue-heading">
          <div class="section-heading"><h2 id="queue-heading">任务队列</h2><span id="queue-count" class="muted small">-</span></div>
          <div class="toolbar">
            <button id="load-queue" class="tool-button" type="button" disabled>载入服务端队列</button>
            <button id="import-queue" class="tool-button" type="button">导入 JSON</button>
            <button id="format-queue" class="tool-button" type="button">格式化</button>
            <button id="download-queue" class="tool-button" type="button">下载 JSON</button>
            <input id="queue-file" type="file" accept=".json,application/json" hidden>
          </div>
          <label for="queue-json" class="small muted">队列 JSON</label>
          <textarea id="queue-json" spellcheck="false" aria-describedby="queue-error"></textarea>
          <div id="queue-error" class="field-error" role="alert" aria-live="polite"></div>
        </section>

        <section class="section" aria-labelledby="run-heading">
          <div class="section-heading"><h2 id="run-heading">运行</h2></div>
          <fieldset id="run-fields">
            <div class="mode-row" role="radiogroup" aria-label="运行模式">
              <label><input type="radio" name="mode" value="dry_run" checked><span>模拟运行</span></label>
              <label><input type="radio" name="mode" value="read_only"><span>设备只读</span></label>
              <label><input type="radio" name="mode" value="actions"><span>执行动作</span></label>
            </div>
            <p id="mode-warning" class="mode-warning small"></p>
            <div class="field-grid">
              <label>设备序列号<input id="serial" type="text" autocomplete="off" placeholder="默认设备"></label>
              <label>时间上限（秒）<input id="max-seconds" type="number" min="0" step="any" placeholder="服务端默认值"></label>
              <label>轮次上限<input id="max-rounds" type="number" min="1" step="1" placeholder="服务端默认值"></label>
            </div>
            <label class="checkline"><input id="resume" type="checkbox"><span>从匹配的断点续跑</span></label>
          </fieldset>
          <div class="action-row">
            <button id="run" class="primary" type="button" disabled>运行队列</button>
            <button id="stop" class="danger" type="button" disabled>请求停止</button>
          </div>
          <p id="action-message" class="action-message small" role="status" aria-live="polite"></p>
        </section>
      </div>

      <div class="report-pane">
        <section class="section" aria-labelledby="report-heading">
          <div class="report-title"><h2 id="report-heading">最近报告</h2><button id="refresh" class="secondary refresh" type="button">刷新</button></div>
          <div id="report-metrics" class="metrics" aria-live="polite"></div>
          <div id="report-meta" class="report-meta small"></div>
        </section>
        <section class="section" aria-labelledby="items-heading">
          <div class="section-heading"><h2 id="items-heading">任务与关卡</h2><span id="item-count" class="muted small"></span></div>
          <div id="items" class="item-list"></div>
        </section>
        <section class="section" aria-labelledby="findings-heading">
          <div class="section-heading"><h2 id="findings-heading">失败与发现</h2><span id="finding-count" class="muted small"></span></div>
          <div id="findings" class="finding-list"></div>
        </section>
        <section class="section" aria-labelledby="logs-heading">
          <div class="section-heading"><h2 id="logs-heading">最近日志</h2><span id="log-count" class="muted small"></span></div>
          <pre id="logs" class="logs"></pre>
        </section>
        <details id="raw-report" class="raw-report"><summary>原始报告 JSON</summary><pre id="report-json"></pre></details>
      </div>
    </div>
  </main>
  <dialog id="actions-dialog" aria-labelledby="actions-title">
    <h2 id="actions-title">确认执行设备动作</h2>
    <p>当前队列将以执行动作模式启动。请核对队列与设备，再确认运行。</p>
    <div class="dialog-actions">
      <button id="cancel-actions" class="secondary" type="button">返回检查</button>
      <button id="confirm-actions" class="danger" type="button">确认运行</button>
    </div>
  </dialog>
  <script>
    (() => {
      "use strict";
      const $ = id => document.getElementById(id);
      const state = { running: false, mode: null, queue: null, report: null, logs: [], error: null, token: "" };
      let online = null;
      let refreshing = false;
      let requestBusy = false;
      let editorLoaded = false;
      let stateLoaded = false;
      let serverQueueText = "";
      let actionMessage = "";
      let connectionError = "";
      let actionError = "";
      let pendingRun = null;

      const isObject = value => value !== null && typeof value === "object" && !Array.isArray(value);
      const display = value => value === null || value === undefined || value === "" ? "-"
        : typeof value === "object" ? JSON.stringify(value, null, 2) : String(value);

      function element(tag, className, value) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (value !== undefined) node.textContent = display(value);
        return node;
      }

      function parseQueue(text) {
        let queue;
        try { queue = JSON.parse(text); }
        catch (error) { throw new Error(`队列 JSON 无法解析：${error.message}`); }
        if (!isObject(queue) || !Array.isArray(queue.tasks) || queue.tasks.length === 0)
          throw new Error("队列必须包含非空 tasks 数组");
        const ids = new Set();
        queue.tasks.forEach((task, index) => {
          const number = index + 1;
          if (!isObject(task)) throw new Error(`第 ${number} 项任务必须是对象`);
          if (typeof task.id !== "string" || !task.id.trim()) throw new Error(`第 ${number} 项任务缺少 id`);
          if (ids.has(task.id.trim())) throw new Error(`任务 id 重复：${task.id.trim()}`);
          ids.add(task.id.trim());
          if (typeof task.kind !== "string" || !task.kind.trim()) throw new Error(`第 ${number} 项任务缺少 kind`);
          if (task.input !== undefined && task.input !== null && !isObject(task.input))
            throw new Error(`第 ${number} 项任务的 input 必须是对象或 null`);
          if (task.required !== undefined && typeof task.required !== "boolean")
            throw new Error(`第 ${number} 项任务的 required 必须是布尔值`);
        });
        return queue;
      }

      function validateEditor() {
        if (!editorLoaded && !$("queue-json").value.trim()) {
          $("queue-error").textContent = "";
          $("queue-json").setAttribute("aria-invalid", "false");
          $("queue-count").textContent = stateLoaded ? "请输入队列 JSON" : "正在载入队列";
          return null;
        }
        try {
          const queue = parseQueue($("queue-json").value);
          $("queue-error").textContent = "";
          $("queue-json").setAttribute("aria-invalid", "false");
          $("queue-count").textContent = `${queue.tasks.length} 项任务`;
          return queue;
        } catch (error) {
          $("queue-error").textContent = error.message;
          $("queue-json").setAttribute("aria-invalid", "true");
          $("queue-count").textContent = "输入有误";
          return null;
        }
      }

      function selectedMode() { return document.querySelector('input[name="mode"]:checked').value; }

      function updateControls() {
        const queue = validateEditor();
        const ready = online && Boolean(state.token) && !requestBusy;
        $("run").disabled = !ready || state.running || !queue;
        $("stop").disabled = !ready || !state.running;
        $("load-queue").disabled = !online || !state.queue || requestBusy;
        $("run-fields").disabled = state.running || requestBusy;
        $("refresh").disabled = refreshing;
        $("mode-warning").textContent = selectedMode() === "actions" ? "执行动作会操作设备，需要再次确认。" : "";
      }

      function renderStatus() {
        const status = $("status");
        status.className = `status ${online ? (state.running ? "running" : "idle") : "offline"}`;
        status.textContent = online === null ? "连接中" : online ? (state.running ? "运行中" : "空闲") : "连接中断";
        $("current-mode").textContent = state.running ? `当前模式：${display(state.mode)}` : "";
        $("notice").textContent = connectionError || actionError || state.error || (online && !state.token ? "服务端未提供操作令牌" : "");
        $("action-message").textContent = actionMessage;
      }

      function metric(label, value) {
        const node = element("div", "metric");
        node.append(element("span", "metric-label", label), element("span", "metric-value", value));
        return node;
      }

      function renderReport() {
        const report = isObject(state.report) ? state.report : null;
        const totals = report && isObject(report.totals) ? report.totals : {};
        $("report-metrics").replaceChildren(
          metric("队列结论", report?.queue_outcome),
          metric("任务失败", totals.tasks_failed),
          metric("证据完整", report?.evidence_complete === undefined || report?.evidence_complete === null ? "-" : report.evidence_complete ? "是" : "否"),
          metric("日志错误", totals.log_errors)
        );
        $("report-meta").textContent = report
          ? `运行目录：${display(report.directory)}   提前停止：${display(report.stopped_early)}   原因：${display(report.stop_reason)}`
          : "尚无运行报告";
        const items = report && Array.isArray(report.items) ? report.items : [];
        $("item-count").textContent = `${items.length} 条`;
        const list = $("items");
        list.replaceChildren();
        if (!items.length) list.append(element("div", "empty", "暂无任务或关卡记录"));
        for (const item of items) {
          const detail = element("details", "item");
          const summary = element("summary");
          const identity = element("span");
          identity.append(element("span", "item-title", item?.id ?? item?.stage ?? item?.chapter ?? item?.level ?? "-"));
          identity.append(element("span", "item-meta", [item?.level, item?.kind ?? item?.chapter].filter(Boolean).join(" / ")));
          const outcome = element("span", "outcome", item?.outcome);
          outcome.dataset.value = typeof item?.outcome === "string" ? item.outcome : "";
          summary.append(identity, outcome);
          detail.append(summary);
          const body = element("div", "item-detail");
          const facts = element("dl");
          for (const key of ["error_kind", "error", "artifact", "boundary_state", "evidence"]) {
            if (item && item[key] !== undefined && item[key] !== null) {
              facts.append(element("dt", "", key), element("dd", "", item[key]));
            }
          }
          if (facts.childNodes.length) body.append(facts);
          body.append(element("pre", "", JSON.stringify(item, null, 2)));
          detail.append(body);
          list.append(detail);
        }

        const findings = report && Array.isArray(report.findings) ? report.findings : [];
        $("finding-count").textContent = `${findings.length} 条`;
        const findingList = $("findings");
        findingList.replaceChildren();
        if (!findings.length) findingList.append(element("div", "empty", "暂无报告发现"));
        for (const finding of findings) {
          const row = element("div", "finding");
          const detail = element("div", "finding-detail", finding?.detail ?? finding?.message);
          if (finding?.artifact) detail.append(element("span", "finding-path", finding.artifact));
          row.append(element("div", "finding-code", finding?.code), detail);
          findingList.append(row);
        }
        $("raw-report").hidden = !report;
        $("report-json").textContent = report ? JSON.stringify(report, null, 2) : "";
      }

      function renderLogs() {
        const logs = Array.isArray(state.logs) ? state.logs : [];
        $("log-count").textContent = `${logs.length} 条`;
        $("logs").textContent = logs.length ? logs.map(display).join("\n") : "暂无日志";
      }

      async function readJson(response) {
        let body;
        try { body = await response.json(); }
        catch { throw new Error(`服务端响应不是 JSON（HTTP ${response.status}）`); }
        if (!response.ok) throw new Error(display(body?.error ?? body?.message ?? `HTTP ${response.status}`));
        return body;
      }

      async function refreshState() {
        if (refreshing) return;
        refreshing = true;
        updateControls();
        try {
          const response = await fetch("/api/state", { cache: "no-store", credentials: "same-origin" });
          const body = await readJson(response);
          if (!isObject(body)) throw new Error("服务端状态格式错误");
          state.running = body.running === true;
          state.mode = body.mode ?? null;
          state.queue = isObject(body.queue) ? body.queue : null;
          state.report = isObject(body.report) ? body.report : null;
          state.logs = Array.isArray(body.logs) ? body.logs : [];
          state.error = body.error ?? null;
          state.token = typeof body.token === "string" ? body.token : "";
          online = true;
          stateLoaded = true;
          connectionError = "";
          if (state.queue) {
            serverQueueText = JSON.stringify(state.queue, null, 2);
            if (!editorLoaded) {
              $("queue-json").value = serverQueueText;
              editorLoaded = true;
            }
          }
          if (!state.running && actionMessage.startsWith("已请求停止")) actionMessage = "运行已停止";
          renderReport();
          renderLogs();
        } catch (error) {
          online = false;
          connectionError = error.message;
        } finally {
          refreshing = false;
          renderStatus();
          updateControls();
        }
      }

      function buildRunRequest() {
        const queue = validateEditor();
        if (!queue) return null;
        const body = { queue, mode: selectedMode(), resume: $("resume").checked };
        const serial = $("serial").value.trim();
        if (serial) body.serial = serial;
        const seconds = $("max-seconds").value.trim();
        if (seconds) {
          const value = Number(seconds);
          if (!Number.isFinite(value) || value <= 0) throw new Error("时间上限必须是正数");
          body.max_seconds = value;
        }
        const rounds = $("max-rounds").value.trim();
        if (rounds) {
          const value = Number(rounds);
          if (!Number.isSafeInteger(value) || value <= 0 || value > 2147483647) throw new Error("轮次上限必须是正整数");
          body.max_rounds = value;
        }
        return body;
      }

      async function postJson(path, body) {
        const response = await fetch(path, {
          method: "POST", credentials: "same-origin",
          headers: { "Content-Type": "application/json", "X-Alas-Token": state.token },
          body: JSON.stringify(body)
        });
        const result = await readJson(response);
        if (result?.error) throw new Error(display(result.error));
        return result;
      }

      async function startRun(body) {
        if (requestBusy || !online || state.running || !state.token) return;
        requestBusy = true;
        actionError = "";
        actionMessage = "正在提交队列...";
        updateControls();
        renderStatus();
        try {
          await postJson("/api/run", body);
          actionMessage = "队列已提交";
          await refreshState();
        } catch (error) {
          actionError = error.message;
          actionMessage = "";
        } finally {
          requestBusy = false;
          renderStatus();
          updateControls();
        }
      }

      $("run").addEventListener("click", () => {
        let body;
        try { body = buildRunRequest(); }
        catch (error) { actionError = error.message; renderStatus(); return; }
        if (!body) return;
        actionError = "";
        renderStatus();
        if (body.mode === "actions") {
          pendingRun = body;
          $("actions-dialog").showModal();
        } else startRun(body);
      });
      $("confirm-actions").addEventListener("click", () => {
        const body = pendingRun;
        pendingRun = null;
        $("actions-dialog").close();
        if (body) startRun(body);
      });
      $("cancel-actions").addEventListener("click", () => { pendingRun = null; $("actions-dialog").close(); });
      $("actions-dialog").addEventListener("close", () => { pendingRun = null; });
      $("stop").addEventListener("click", async () => {
        if (requestBusy || !online || !state.running || !state.token) return;
        requestBusy = true;
        actionError = "";
        actionMessage = "正在请求停止...";
        updateControls();
        renderStatus();
        try {
          await postJson("/api/stop", {});
          actionMessage = "已请求停止；当前任务结束后生效";
          await refreshState();
        } catch (error) {
          actionError = error.message;
          actionMessage = "";
        } finally {
          requestBusy = false;
          renderStatus();
          updateControls();
        }
      });
      const editChanged = () => { actionError = ""; renderStatus(); updateControls(); };
      $("queue-json").addEventListener("input", () => { editorLoaded = true; editChanged(); });
      document.querySelectorAll('input[name="mode"]').forEach(node => node.addEventListener("change", editChanged));
      for (const id of ["serial", "max-seconds", "max-rounds", "resume"]) $(id).addEventListener("input", editChanged);
      $("refresh").addEventListener("click", refreshState);
      $("load-queue").addEventListener("click", () => {
        if (!serverQueueText) return;
        if ($("queue-json").value !== serverQueueText && !window.confirm("载入服务端队列并舍弃当前编辑？")) return;
        $("queue-json").value = serverQueueText;
        updateControls();
      });
      $("format-queue").addEventListener("click", () => {
        const queue = validateEditor();
        if (queue) $("queue-json").value = JSON.stringify(queue, null, 2);
        updateControls();
      });
      $("import-queue").addEventListener("click", () => $("queue-file").click());
      $("queue-file").addEventListener("change", async event => {
        const file = event.target.files?.[0];
        if (!file) return;
        try {
          const text = await file.text();
          parseQueue(text);
          $("queue-json").value = text;
          editorLoaded = true;
          actionError = "";
        } catch (error) { actionError = `导入失败：${error.message}`; }
        event.target.value = "";
        renderStatus();
        updateControls();
      });
      $("download-queue").addEventListener("click", () => {
        const queue = validateEditor();
        if (!queue) return;
        const url = URL.createObjectURL(new Blob([JSON.stringify(queue, null, 2) + "\n"], { type: "application/json" }));
        const link = element("a");
        link.href = url;
        link.download = "queue.json";
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 0);
      });

      renderReport();
      renderLogs();
      renderStatus();
      updateControls();
      refreshState();
      setInterval(refreshState, 2500);
    })();
  </script>
</body>
</html>
